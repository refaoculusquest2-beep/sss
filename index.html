<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://widgets.coingecko.com/gecko-coin-price-chart-widget.js"></script>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

gecko-coin-price-chart-widget {
    width:100vw;
    height:100vh;
    display:block;
}
</style>

</head>

<body>

<gecko-coin-price-chart-widget
    locale="fr"
    dark-mode="true"
    outlined="true"
    coin-id="solana"
    initial-currency="eur">
</gecko-coin-price-chart-widget>

</body>
</html>
